name: UI sweep
# Non-blocking on purpose (continue-on-error) until the owner approves the first baseline: a red sweep never blocks a merge.
on:
  push: { branches: [main, feature/ui-sweep] }   # feature/ui-sweep: TEMPORARY, removed before the merge (first baseline run)
  workflow_dispatch:
    inputs:
      update_baseline:
        description: "Rewrite the visual baseline (e2e/sweep/__screenshots__) instead of comparing; download the sweep-baseline-* artifacts and commit them"
        type: boolean
        default: false
      projects:
        description: "Comma list of projects to run (default: all)"
        type: string
        default: ""
jobs:
  sweep:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        project: [chromium-320, chromium-375, chromium-768, chromium-1280, chromium-1920, firefox-375, firefox-1280, webkit-375, webkit-1280, chromium-1280-zoom200]
        # role groups keep every job well under the time limit (the clickables check reloads the page after each click)
        group: [seller-owner, seller-admin, seller-manager, seller-viewer, signed-out-pending-driver, staff-super, staff-others]
        include:
          - { group: seller-owner, roles: owner }
          - { group: seller-admin, roles: admin }
          - { group: seller-manager, roles: manager }
          - { group: seller-viewer, roles: viewer }
          - { group: signed-out-pending-driver, roles: "anon,pending,driver" }
          - { group: staff-super, roles: superadmin }
          - { group: staff-others, roles: "support,moderator,readonly" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Yanky1/Yanky1-test-login-backend
          path: backend
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 10.0.x }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # Chromium in every job: the global setup (page discovery) always runs in it, whatever browser the project tests
      - run: npx playwright install --with-deps chromium
      - run: npx playwright install --with-deps firefox
        if: startsWith(matrix.project, 'firefox')
      - run: npx playwright install --with-deps webkit
        if: startsWith(matrix.project, 'webkit')
      - run: dotnet build backend/src/Solvelt.Api -c Debug
      - name: Sweep ${{ matrix.project }} / ${{ matrix.group }}
        id: sweep
        if: github.event.inputs.projects == '' || contains(github.event.inputs.projects, matrix.project)
        run: npx playwright test -c playwright.sweep.config.ts ${{ (github.event.inputs.update_baseline == 'true' || contains(github.event.head_commit.message, '[sweep-baseline]')) && '--update-snapshots=all' || '' }}
        env:
          CI: "true"
          BACKEND_DIR: backend
          SWEEP_PROJECTS: ${{ matrix.project }}
          SWEEP_MAX_CLICKS: "30"   # per page; keeps a job well under an hour
          SWEEP_ROLES: ${{ matrix.roles }}
          SWEEP_REPORT_DIR: sweep-out/playwright-report-${{ matrix.project }}-${{ matrix.group }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sweep-${{ matrix.project }}-${{ matrix.group }}
          path: |
            sweep-out/shots
            sweep-out/data
            sweep-out/playwright-report-*
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always() && (github.event.inputs.update_baseline == 'true' || contains(github.event.head_commit.message, '[sweep-baseline]'))
        with:
          name: sweep-baseline-${{ matrix.project }}-${{ matrix.group }}
          path: e2e/sweep/__screenshots__
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: sweep-traces-${{ matrix.project }}-${{ matrix.group }}
          path: sweep-out/test-results
          if-no-files-found: ignore
  lighthouse:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: Yanky1/Yanky1-test-login-backend, path: backend }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 10.0.x }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: dotnet build backend/src/Solvelt.Api -c Debug
      - run: npx playwright test -c playwright.sweep.config.ts
        env: { CI: "true", BACKEND_DIR: backend, SWEEP_PROJECTS: lighthouse, SWEEP_ROLES: "anon,owner,pending,superadmin" }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: sweep-lighthouse, path: sweep-out/data, if-no-files-found: ignore }
  report:
    needs: [sweep, lighthouse]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only used to commit a newly approved baseline to the branch the run was started on (never main)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: "sweep-*", path: parts }
      - name: Merge parts, build gallery and summary
        run: |
          mkdir -p sweep-out
          for d in parts/sweep-*; do case "$d" in *baseline*|*traces*) continue;; esac; cp -r "$d"/. sweep-out/ 2>/dev/null || true; done
          node e2e/sweep/report.mjs sweep-out
          cat sweep-out/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: sweep-report
          path: |
            sweep-out/gallery
            sweep-out/shots
            sweep-out/summary.md
            sweep-out/findings.json
            sweep-out/playwright-report-*
      - name: Commit the new visual baseline (baseline runs on a branch other than main)
        if: github.ref != 'refs/heads/main' && (github.event.inputs.update_baseline == 'true' || contains(github.event.head_commit.message, '[sweep-baseline]'))
        run: |
          mkdir -p e2e/sweep/__screenshots__
          for d in parts/sweep-baseline-*; do cp -r "$d"/. e2e/sweep/__screenshots__/ 2>/dev/null || true; done
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/sweep/__screenshots__
          git diff --cached --quiet && { echo "baseline unchanged"; exit 0; }
          git commit -q -m "UI sweep: visual baseline (generated by the sweep workflow, review the gallery first) [skip ci]"
          git pull -q --rebase origin "${GITHUB_REF_NAME}"
          git push -q origin "HEAD:${GITHUB_REF_NAME}"
