name: Offers screenshots
# THROWAWAY (branch shots/offers-c18 only, never merged): captures docs/screenshots/offers with e2e/offers-shots.spec.ts against backend main
# and commits the PNGs back to this branch (same commit-back approach as the sweep baseline, see docs/DESIGN.md W-F8).
on:
  push: { branches: ['shots/**'] }
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Yanky1/Yanky1-test-login-backend
          path: backend
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 10.0.x }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: dotnet build backend/src/Solvelt.Api -c Debug
      - run: mkdir -p docs/screenshots/offers
      - run: npx playwright test e2e/offers-shots.spec.ts
        env: { CI: "true", BACKEND_DIR: backend, SHOTS_DIR: docs/screenshots/offers }
      - run: npx playwright test e2e/offers-shots.spec.ts
        env: { CI: "true", BACKEND_DIR: backend, SHOTS_DIR: docs/screenshots/offers, SHOT_THEME: dark }
      - name: commit the screenshots back to this branch
        run: |
          ls -la docs/screenshots/offers
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/offers
          git commit -q -m "Offers screenshots (generated by the offers-shots workflow) [skip ci]"
          git push -q origin "HEAD:${GITHUB_REF_NAME}"
